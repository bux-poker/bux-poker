# fly.toml — bux-poker (Fly sets PORT to match internal_port, e.g. 8080)
# See https://fly.io/docs/reference/configuration/

app = "bux-poker"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "180s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
