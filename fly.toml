# Fly.io app name must be globally unique. If `bux-poker-server` is taken, run:
#   fly apps create <your-name>
# then set `app = "<your-name>"` below and rebuild the client fallback / Vercel VITE_API_BASE_URL.
#
# After first deploy:
#   fly secrets set DATABASE_URL=<neon> REDIS_URL=<redis> SESSION_SECRET=<...> JWT_SECRET=<...> \
#     DISCORD_CLIENT_ID=<...> DISCORD_CLIENT_SECRET=<...> DISCORD_BOT_TOKEN=<...> \
#     CLIENT_URL=https://bux-poker.pro API_BASE_URL=https://<your-app>.fly.dev
# (copy values from Render; add any other vars you use there.)
#
# Vercel: set VITE_API_BASE_URL and VITE_SOCKET_URL to https://<your-app>.fly.dev
# Discord Developer Portal: add redirect https://<your-app>.fly.dev/api/auth/discord/callback
#   if you use Passport on the API directly; Vercel OAuth flow may still use /oauth/discord on www.

app = "bux-poker-server"
primary_region = "lhr"

[build]

[env]
  NODE_ENV = "production"
  PORT = "3000"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "120s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
