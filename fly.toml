# fly.toml — bux-poker (Fly sets PORT to match internal_port, e.g. 8080)
# See https://fly.io/docs/reference/configuration/

app = "bux-poker"
primary_region = "ams"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"

# Run Prisma once per deploy; machine boot only starts Node (fast bind on :8080 for fly-proxy).
# ha=false: poker uses in-memory tableState; Fly's default (ha=true) creates 2 machines and breaks games.
[deploy]
  ha = false
  release_command = "sh -c 'cd /app/server && node scripts/prisma-migrate-deploy-or-repair.mjs && npx prisma generate --schema=../prisma/schema.prisma'"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = "15s"
    timeout = "10s"
    grace_period = "60s"
    method = "GET"
    path = "/api/health"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
